name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: |
          mkdir proj
          unzip -q Pratik_AI_Voice_Assistant_v2.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: proj/**/build/outputs/apk/debug/*.apk
